<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rejestr pobrania kluczy</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f5f7;
    color: #222;
}

.container {
    max-width: 520px;
    margin: auto;
    padding: 25px 18px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 25px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}

.logo {
    text-align: center;
    font-size: 50px;
    margin-bottom: 10px;
}

h1 {
    text-align: center;
    margin: 5px 0;
    font-size: 23px;
    white-space: nowrap;
}

.subtitle {
    text-align: center;
    color: #555;
    font-size: 18px;
    margin-top: 6px;
    margin-bottom: 30px;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 20px;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 15px;
    font-size: 17px;
    border-radius: 10px;
    border: 1px solid #bbb;
    background: white;
}

input:focus {
    outline: 2px solid #0067b8;
    border-color: #0067b8;
}

.rooms-title {
    font-weight: bold;
    margin-top: 25px;
    margin-bottom: 10px;
}

.rooms {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.room {
    padding: 14px 5px;
    border: 2px solid #bbb;
    background: white;
    border-radius: 10px;
    font-size: 17px;
    cursor: pointer;
}

.room.active {
    border-color: #0067b8;
    background: #e7f3ff;
    font-weight: bold;
}

.actions {
    margin-top: 30px;
    display: grid;
    gap: 12px;
}

button.action {
    border: none;
    border-radius: 12px;
    padding: 18px;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
}

.take {
    background: #107c10;
    color: white;
}

.return {
    background: #0067b8;
    color: white;
}

#message {
    margin-top: 20px;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    display: none;
}

.error {
    background: #fde7e9;
    color: #a80000;
}

.success {
    background: #dff6dd;
    color: #107c10;
}

.footer {
    text-align: center;
    color: #666;
    font-size: 13px;
    margin-top: 22px;
}

/* Na bardzo małych telefonach nagłówek dopasuje się do ekranu */
@media (max-width: 430px) {
    h1 {
        font-size: 19px;
    }

    .card {
        padding: 20px 16px;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="logo">🔑</div>

<h1>REJESTR POBRANIA KLUCZY</h1>
<div class="subtitle">do szaf z laptopami</div>

<label for="teacher">Nauczyciel</label>

<input
    type="text"
    id="teacher"
    placeholder="Wpisz imię i nazwisko"
    autocomplete="name"
>

<div class="rooms-title">SALE wyposażone w laptopy</div>

<div class="rooms">
    <button class="room" onclick="selectRoom(this,'01')">01</button>
    <button class="room" onclick="selectRoom(this,'15')">15</button>
    <button class="room" onclick="selectRoom(this,'19')">19</button>
    <button class="room" onclick="selectRoom(this,'25')">25</button>
</div>

<div class="actions">

<button class="action take" onclick="register('Pobieram')">
🔑 POBIERAM KLUCZ
</button>

<button class="action return" onclick="register('Oddaję')">
↩ ODDAJĘ KLUCZ
</button>

</div>

<div id="message"></div>

</div>

<div class="footer">
Zespół Szkół Technicznych w Słupsku ® 2026
</div>

</div>

<script>

let selectedRoom = "";

/* Odczyt zapamiętanego nazwiska */
window.addEventListener("DOMContentLoaded", function() {
    const savedTeacher = localStorage.getItem("szafaAI_nauczyciel");

    if (savedTeacher) {
        document.getElementById("teacher").value = savedTeacher;
    }
});

function selectRoom(button, room) {

    selectedRoom = room;

    document.querySelectorAll(".room").forEach(b => {
        b.classList.remove("active");
    });

    button.classList.add("active");
}

async function register(operation) {

    const teacher =
        document.getElementById("teacher").value.trim();

    if (!teacher) {
        showMessage("Wpisz imię i nazwisko.", false);
        return;
    }

    if (!selectedRoom) {
        showMessage("Wybierz salę.", false);
        return;
    }

    // Zapamiętanie nazwiska na tym urządzeniu
    localStorage.setItem("szafaAI_nauczyciel", teacher);

    showMessage("Zapisywanie...", true);

    try {

        const response = await fetch(
            "https://zst-szafa-ai-api.radoslaw-sorbian.workers.dev",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    nauczyciel: teacher,
                    operacja: operation,
                    sala: selectedRoom
                })
            }
        );

        const result = await response.json();

        if (!response.ok || !result.ok) {
            throw new Error(result.error || "Błąd zapisu");
        }

        showMessage(
            "✓ ZAREJESTROWANO" +
            operation + " klucz – sala " + selectedRoom,
            true
        );

    } catch (error) {

        showMessage(
            "Nie udało się zapisać. Spróbuj ponownie.",
            false
        );
    }
}

function showMessage(text, success) {

    const message = document.getElementById("message");

    message.style.display = "block";
    message.className = success ? "success" : "error";
    message.textContent = text;
}

</script>

</body>
</html>
